name: release

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      # write, not read: ci.yml builds the game images, and a caller is capped against every
      # nested job's permissions
      packages: write
    # the image jobs log into Steam, and a called workflow sees no secret it was not handed
    secrets: inherit

  sonar:
    uses: ./.github/workflows/sonar.yml
    permissions:
      contents: read
      # write, for the same reason as the ci job: sonar.yml builds its own game image
      packages: write
    # inherit, not just SONAR_TOKEN: the image job logs into Steam
    secrets: inherit

  release:
    name: semantic-release
    needs: [ci, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
    outputs:
      published: ${{ steps.after.outputs.published }}
      version: ${{ steps.after.outputs.version }}
      tag: ${{ steps.after.outputs.tag }}
      previous-tag: ${{ steps.before.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      # one artifact per matrix leg, named "build-output <version>"
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          pattern: 'build-output *'
          merge-multiple: true
          path: .

      # semantic-release rebuilds every version, and every build needs real game assemblies
      - name: Stage RimWorld 1.5 refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game-1.5

      - name: Stage RimWorld 1.6 refs
        id: refs-16
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game-1.6

      - name: Stage RimWorld 1.7 refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.7'] }}
          dest: ${{ runner.temp }}/game-1.7

      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPLIT_PUBLISH: '1'
          # dotnet pack and the stamp both take the default version; the per-version builds
          # pass their own -p:GameManagedDir, which beats this
          GameManagedDir: ${{ steps.refs-16.outputs.managed-dir }}
        run: ./node_modules/.bin/semantic-release

      - name: Read the tag it just cut
        id: after
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$tag" = "${{ steps.before.outputs.tag }}" ] || [ -z "$tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the packed nupkgs
        if: steps.after.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-nupkgs
          path: nupkgs/*.nupkg
          if-no-files-found: error

      - name: Upload the release zips
        if: steps.after.outputs.published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: dist/*.zip
          if-no-files-found: error

  nuget:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download the packed nupkgs
        uses: actions/download-artifact@v8
        with:
          name: release-nupkgs
          path: nupkgs

      - name: NuGet login (OIDC trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --timeout 1200 \
            --skip-duplicate

  publish:
    needs: [release, nuget]
    if: needs.release.outputs.published == 'true'
    uses: RimWorks/mod-ci/.github/workflows/publish.yml@v4
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
      zip-artifact: release-zips
      discord-mod-name: RimLogging
      discord-workshop-id: '3733484696'
      discord-embed-color: 3498DB
      tag: ${{ needs.release.outputs.tag }}
      previous-tag: ${{ needs.release.outputs.previous-tag }}
