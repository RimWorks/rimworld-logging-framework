name: release

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      # write, not read: ci.yml builds the game images, and a caller is capped against every
      # nested job's permissions
      packages: write
    # the image jobs log into Steam, and a called workflow sees no secret it was not handed
    secrets: inherit

  sonar:
    uses: ./.github/workflows/sonar.yml
    permissions:
      contents: read
      # write, for the same reason as the ci job: sonar.yml builds its own game image
      packages: write
    # inherit, not just SONAR_TOKEN: the image job logs into Steam
    secrets: inherit

  release:
    name: semantic-release
    needs: [ci, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      # one artifact per matrix leg, named "build-output <version>"
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          pattern: 'build-output *'
          merge-multiple: true
          path: .

      # semantic-release rebuilds every version, and every build needs real game assemblies
      - name: Stage RimWorld 1.5 refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v3
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game-1.5

      - name: Stage RimWorld 1.6 refs
        id: refs-16
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v3
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game-1.6

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - uses: RimWorks/mod-ci/.github/actions/steam-login@v3
        with:
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          steam-username: ${{ secrets.STEAM_USERNAME }}

      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          WORKSHOP_ID: ${{ vars.WORKSHOP_ID }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          # dotnet pack and the stamp both take the default version; the per-version builds
          # pass their own -p:GameManagedDir, which beats this
          GameManagedDir: ${{ steps.refs-16.outputs.managed-dir }}
        run: ./node_modules/.bin/semantic-release

      - uses: RimWorks/mod-ci/.github/actions/discord-release@v3
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          mod-name: RimLogging
          role-ids: ${{ vars.DISCORD_ROLE_IDS }}
          workshop-id: '3733484696'
          embed-color: 3498DB
          previous-tag: ${{ steps.before.outputs.tag }}
