name: ci

on:
  workflow_call:
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet restore
        run: dotnet restore RimWorks.RimLogging.slnx

      - name: dotnet build
        run: dotnet build RimWorks.RimLogging.slnx -c Release --nologo --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-output
          if-no-files-found: error
          path: |
            Assemblies/
            Concord/Assemblies/
            Harmony/Assemblies/

      - name: dotnet test
        run: dotnet test RimWorks.RimLogging.slnx -c Release --nologo --no-build --logger "console;verbosity=normal"

      - name: dotnet format
        run: dotnet format RimWorks.RimLogging.slnx --verify-no-changes --no-restore

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@d6261858b6b74c0cd3ca03c6402c954d58ac7fee # v1.5.1

  links:
    uses: RimWorks/mod-ci/.github/workflows/links.yml@d6261858b6b74c0cd3ca03c6402c954d58ac7fee # v1.5.1
    with:
      args: --no-progress README.md
