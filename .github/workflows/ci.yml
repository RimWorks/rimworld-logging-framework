name: ci

on:
  workflow_call:
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet restore
        run: dotnet restore RimWorks.RimLogging.slnx

      - name: dotnet build
        run: dotnet build RimWorks.RimLogging.slnx -c Release --nologo --no-restore

      # Assemblies/, Concord/Assemblies/, Harmony/Assemblies/ are gitignored build output;
      # release.yml downloads this instead of rebuilding what already passed here.
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          # error, not the default warn: a partial artifact ships a mod missing a backend dll
          if-no-files-found: error
          path: |
            Assemblies/
            Concord/Assemblies/
            Harmony/Assemblies/

      - name: dotnet test
        run: dotnet test RimWorks.RimLogging.slnx -c Release --nologo --no-build --logger "console;verbosity=normal"

      # last, so a formatting nit never hides a real test failure
      - name: dotnet format
        run: dotnet format RimWorks.RimLogging.slnx --verify-no-changes --no-restore

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@dbb33c36ad8165dd9ffbe567c07055cbfb0b5c21 # v1.4.0

  links:
    uses: RimWorks/mod-ci/.github/workflows/links.yml@dbb33c36ad8165dd9ffbe567c07055cbfb0b5c21 # v1.4.0
    with:
      # no lychee.toml in this repo, so drop the shared default's --config flag
      args: --no-progress README.md
