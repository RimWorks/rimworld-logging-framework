name: ci

on:
  workflow_call:
    outputs:
      image-refs:
        description: JSON map of game version to the image that version compiled against
        value: ${{ jobs.images.outputs.image-refs }}
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # one call, one leg per version: the workflow matrixes internally and returns a map
  images:
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      branches: |
        1.5=version-1.5
        1.6=version-1.6.4633
    secrets: inherit

  build:
    name: build
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v2
    permissions:
      contents: read
      checks: write
      packages: read
    with:
      solution: RimWorks.RimLogging.slnx
      dotnet-version: |
        8.0.x
        10.0.x
      artifact-name: build-output
      # a glob, not 1.6/Assemblies/: upload-artifact roots the archive at the last literal
      # path segment, so a literal version folder would be stripped back out of the artifact
      artifact-paths: |
        [0-9].[0-9]/
      game-images: ${{ needs.images.outputs.image-refs }}

  package-deps:
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/package-deps.yml@v2
    permissions:
      contents: read
      packages: read
    with:
      project: Source/RimWorks.RimLogging/RimWorks.RimLogging.csproj
      reference-packages: |
        Concord.Ref
        Microsoft.NETFramework.ReferenceAssemblies
      game-image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v2

  links:
    # No args override: the default already passes --config lychee.toml.
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v2
