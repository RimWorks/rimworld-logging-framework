name: ci

on:
  workflow_call:
    outputs:
      image-15:
        description: RimWorld 1.5 image the build compiled against
        value: ${{ jobs.image-15.outputs.image-ref }}
      image-16:
        description: RimWorld 1.6 image the build compiled against
        value: ${{ jobs.image-16.outputs.image-ref }}
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # one call per version: game-image.yml returns a single image-ref and a matrix inside a
  # reusable workflow cannot emit a map, so the caller composes the pairs
  image-15:
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      branch: version-1.5
    secrets: inherit

  image-16:
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      branch: version-1.6.4633
    secrets: inherit

  build:
    name: build
    needs: [image-15, image-16]
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
      packages: read
    with:
      solution: RimWorks.RimLogging.slnx
      dotnet-version: |
        8.0.x
        10.0.x
      artifact-name: build-output
      # a glob, not 1.6/Assemblies/: upload-artifact roots the archive at the last literal
      # path segment, so a literal version folder would be stripped back out of the artifact
      artifact-paths: |
        [0-9].[0-9]/
      game-images: |
        1.5=${{ needs.image-15.outputs.image-ref }}
        1.6=${{ needs.image-16.outputs.image-ref }}

  package-deps:
    needs: [image-16]
    uses: RimWorks/mod-ci/.github/workflows/package-deps.yml@v1
    permissions:
      contents: read
      packages: read
    with:
      project: Source/RimWorks.RimLogging/RimWorks.RimLogging.csproj
      reference-packages: |
        Concord.Ref
        Microsoft.NETFramework.ReferenceAssemblies
      game-image: ${{ needs.image-16.outputs.image-ref }}

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v1

  links:
    # No args override: the default already passes --config lychee.toml.
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v1
