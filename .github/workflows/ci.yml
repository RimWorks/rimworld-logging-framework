name: ci

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet restore
        run: dotnet restore RimWorks.RimLogging.slnx

      - name: dotnet build
        run: dotnet build RimWorks.RimLogging.slnx -c Release --nologo --no-restore

      - name: dotnet test
        run: dotnet test RimWorks.RimLogging.slnx -c Release --nologo --no-build --logger "console;verbosity=normal"

      # last, so a formatting nit never hides a real test failure
      - name: dotnet format
        run: dotnet format RimWorks.RimLogging.slnx --verify-no-changes --no-restore

  prose:
    name: prose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Vale
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # reviewdog
        with:
          reporter: github-pr-check
          fail_on_error: true
