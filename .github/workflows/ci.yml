name: ci

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet restore
        run: dotnet restore RimWorks.RimLogging.sln

      - name: dotnet build
        run: dotnet build RimWorks.RimLogging.sln -c Release --nologo --no-restore

      - name: dotnet test
        run: dotnet test RimWorks.RimLogging.sln -c Release --nologo --no-build --logger "console;verbosity=normal"

      # last, so a formatting nit never hides a real test failure
      - name: dotnet format
        run: dotnet format RimWorks.RimLogging.sln --verify-no-changes --no-restore
