name: weekly-verify

on:
  schedule:
    - cron: '0 13 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: weekly-image-ref
      branches: |
        1.5=version-1.5
        1.6=version-1.6.4633
    secrets: inherit

  verify:
    name: verify against current RimWorld, then republish
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Stage RimWorld 1.5 refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v2
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game-1.5

      - name: Stage RimWorld 1.6 refs
        id: refs-16
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v2
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game-1.6

      # test, format and restore take the default GameVersion, so they need its refs by name
      - name: Point msbuild at the default version
        run: echo "GameManagedDir=${{ steps.refs-16.outputs.managed-dir }}" >> "$GITHUB_ENV"

      - name: dotnet restore
        run: dotnet restore RimWorks.RimLogging.slnx

      - name: Record resolved RimWorld version
        run: |
          version=$(cat "${{ steps.refs-16.outputs.managed-dir }}/Version.txt")
          echo "RIMWORLD_REF=$version" >> "$GITHUB_ENV"
          echo "resolved RimWorld ref: $version"

      - name: dotnet build
        run: npx build-mod RimWorks.RimLogging.slnx

      - name: dotnet test
        run: |
          set -o pipefail
          dotnet test RimWorks.RimLogging.slnx -c Release --nologo --no-build \
            --logger "console;verbosity=normal" | tee test-output.txt
          passed=$(grep -oE 'Passed:[[:space:]]+[0-9]+' test-output.txt | grep -oE '[0-9]+' | tail -1)
          echo "TESTS_PASSED=${passed:-unknown}" >> "$GITHUB_ENV"

      - name: dotnet format
        run: dotnet format RimWorks.RimLogging.slnx --verify-no-changes

      # the republish pushes whatever is on disk, so check it before Steam sees it
      - name: Verify the ship list
        run: npx verify-ship-list .

      - uses: RimWorks/mod-ci/.github/actions/steam-republish@v2
        with:
          solution: RimWorks.RimLogging.slnx
          workshop-id: ${{ vars.WORKSHOP_ID }}
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          verified-rimworld: ${{ env.RIMWORLD_REF }}
          verified-tests: ${{ env.TESTS_PASSED }}
