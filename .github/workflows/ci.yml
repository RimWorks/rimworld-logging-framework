name: ci

on:
  workflow_call:
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
      packages: read
    with:
      solution: RimWorks.RimLogging.slnx
      dotnet-version: |
        8.0.x
        10.0.x
      artifact-name: build-output
      artifact-paths: |
        Assemblies/
        Concord/Assemblies/
        Harmony/Assemblies/

  prose:
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v1

  links:
    # No args override: the default already passes --config lychee.toml.
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v1
