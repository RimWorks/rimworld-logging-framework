name: sonar

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  pull_request:
    branches: [main, beta]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    uses: RimWorks/mod-ci/.github/workflows/sonar.yml@d6261858b6b74c0cd3ca03c6402c954d58ac7fee # v1.5.1
    with:
      solution: RimWorks.RimLogging.slnx
      project-key: RimWorks_rimworld-logging-framework
      coverage-exclusions: "**/Hijack/**,**/Bootstrap/**,**/Settings/LogDirectory.cs,**/Settings/LoggingSettings.cs,**/Settings/LoggingSettingsWindow.cs,**/Settings/LoggingMod.cs,**/Sinks/VerseLogSink.cs,**/Sinks/SinkDef.cs,**/Pipeline/ShutdownFlush.cs,**/Bundle/ModListSnapshot.cs,**/Bundle/BundlerSessionFactory.cs,**/Channels/ChannelDef.cs,**/Channels/ChannelRegistry.cs,**/Sinks/SinkLoader.cs,**/Viewer/LogViewerWindow.cs,**/Viewer/LogDetailWindow.cs,**/Viewer/LogDetailView.cs,**/Viewer/LogBundleShare.cs,**/Viewer/LevelColors.cs,**/Viewer/LogViewerBoot.cs,**/Viewer/ViewerHooks.cs,**/Viewer/ListTailing.cs,**/Patching/PatchBackends.cs,**/Viewer/ChannelClassifierBootstrap.cs,**/Viewer/SuggestField.cs,**/Viewer/Dialog_NameFilterPreset.cs,**/Dev/LogSeederDebugAction.cs"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
