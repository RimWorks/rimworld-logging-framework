name: release

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      packages: read

  sonar:
    uses: ./.github/workflows/sonar.yml
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: semantic-release
    needs: [ci, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: build-output
          path: .

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - uses: RimWorks/mod-ci/.github/actions/steam-login@v1
        with:
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          steam-username: ${{ secrets.STEAM_USERNAME }}

      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          WORKSHOP_ID: ${{ vars.WORKSHOP_ID }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: ./node_modules/.bin/semantic-release

      - uses: RimWorks/mod-ci/.github/actions/discord-release@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          mod-name: RimLogging
          role-ids: ${{ vars.DISCORD_ROLE_IDS }}
          workshop-id: '3733484696'
          embed-color: 3498DB
          previous-tag: ${{ steps.before.outputs.tag }}
